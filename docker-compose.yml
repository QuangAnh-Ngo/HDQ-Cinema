services:
  backend:
    build: ./backend
    container_name: hdq-cinema-backend
    restart: on-failure
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
    depends_on:
      - postgres-db
    networks:
      - cinema-network

  frontend:
    build: ./frontend
    container_name: hdq-cinema-frontend
    restart: unless-stopped
    networks:
      - cinema-network

  postgres-db:
    image: postgres:17
    container_name: hdq-cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinema-network

  nginx:
    image: nginx:latest
    container_name: hdq-cinema-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - cinema-network

volumes:
  postgres_data:

networks:
  cinema-network:
    driver: bridge
